<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>JALDORX — Warenkorb</title><style>
:root{--bg:#050505;--fg:#fff;--muted:#aaa;--gold:#d7b43a;--cyan:#00d9ff;--pink:#ff1493;--yellow:#ffe500;--red:#e5232e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
a{text-decoration:none;color:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:#050505e8;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff14}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900}.logo b{color:var(--red)}
.navlinks{display:flex;gap:18px;align-items:center;font-size:14px;font-weight:800}.navlinks a:hover{opacity:.8}.pill{border:1px solid #ffffff33;border-radius:999px;padding:10px 14px}.cart-link{white-space:nowrap}
main{padding-top:68px}.hero{min-height:820px;padding:90px 0 80px;display:grid;align-items:center;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}.kicker{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--cyan)}
h1{font-size:clamp(55px,8vw,95px);line-height:.96;letter-spacing:-.045em;margin:16px 0 24px}h1 span{color:var(--gold)}
h2{font-size:clamp(40px,6vw,68px);line-height:1;letter-spacing:-.04em;margin:12px 0 20px}
.hero p,.lead{font-size:19px;color:#ccc;max-width:650px;line-height:1.55}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{padding:14px 20px;border-radius:10px;font-weight:900;display:inline-block;border:0;cursor:pointer}.primary{background:#fff;color:#000}.secondary{border:1px solid #555;background:transparent;color:#fff}
.product{height:500px;display:grid;place-items:center;position:relative}.product:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,var(--cyan),transparent 68%);opacity:.16;filter:blur(25px)}
.pouch{position:relative;width:245px;height:365px;border:1px solid #555;border-radius:8px;background:linear-gradient(145deg,#1b1b1b,#020202);box-shadow:0 35px 90px #000;display:grid;place-items:center;text-align:center;color:var(--gold);transform:rotate(2deg)}
.pouch strong{display:block;font-size:25px}.diamond{width:72px;height:72px;border:2px solid var(--gold);margin:25px auto;display:grid;place-items:center;transform:rotate(45deg)}.diamond span{transform:rotate(-45deg);font-size:36px}.pouch small{font-weight:800;letter-spacing:.04em}
section.block{padding:105px 0;border-top:1px solid #ffffff12}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
.card,.step,.futurebox,.insiderbox,.product-card,.cart-box{border:1px solid #ffffff18;border-radius:18px;background:#0b0b0b;padding:28px}.card p,.step p{color:var(--muted);line-height:1.6}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}.num{font-size:52px;font-weight:900}.step:nth-child(1) .num{color:var(--pink)}.step:nth-child(2) .num{color:var(--cyan)}.step:nth-child(3) .num{color:var(--yellow)}
.gold{text-align:center}.goldmark{font-size:70px;color:var(--gold)}.soon{display:inline-block;color:var(--gold);border:1px solid #d7b43a99;border-radius:999px;padding:8px 14px;font-weight:900;letter-spacing:.15em}
.brand{text-align:center}.brandname{font-size:clamp(65px,12vw,130px);font-weight:1000;letter-spacing:-.08em;margin:25px 0}.brandname b{color:var(--red)}.brand .lead{margin:auto}
.future{text-align:center}.futurebox{max-width:720px;margin:35px auto;color:#999;border-style:dashed}
.insiderbox{display:flex;justify-content:space-between;gap:30px;align-items:center}.insider form{display:flex;gap:10px}.insider input{padding:14px;border-radius:10px;border:1px solid #444;background:#050505;color:white}
.footer{padding:42px 0;border-top:1px solid #ffffff12;color:#888;font-size:13px}.footrow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footlinks{display:flex;gap:18px;flex-wrap:wrap}
.page{padding:55px 0 90px}.page-head{margin-bottom:35px}.page-head p{color:#aaa;line-height:1.6}
.shop-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:28px}.product-card{padding:35px}.price{font-size:34px;font-weight:900}.muted{color:#999}.qty{display:flex;align-items:center;gap:8px;margin:22px 0}.qty button{width:44px;height:44px;border:1px solid #444;background:#111;color:#fff;border-radius:10px;font-size:22px;cursor:pointer}.qty input{width:90px;height:44px;text-align:center;border:1px solid #444;background:#050505;color:#fff;border-radius:10px;font-size:18px}
.discount-box{margin:20px 0;padding:16px;border:1px solid #ffffff18;border-radius:12px;color:#ccc}.warning{color:#ff8b8b;min-height:24px;margin:8px 0}.shop-visual{min-height:360px;display:grid;place-items:center;background:linear-gradient(145deg,#101010,#050505);border-radius:16px;border:1px solid #ffffff12}
.mini-cart{position:fixed;right:16px;top:78px;width:min(380px,calc(100% - 32px));background:#111;border:1px solid #ffffff25;border-radius:16px;padding:20px;z-index:100;box-shadow:0 20px 60px #000;display:none}.mini-cart.open{display:block}.mini-cart h3{margin-top:0}.mini-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.cart-box{padding:28px}.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid #ffffff12}.cart-actions{display:flex;gap:8px;align-items:center}.small-btn{border:1px solid #444;background:#111;color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.remove{color:#ff8b8b}.cart-total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;padding:22px 0}.cart-buttons{display:flex;gap:10px;flex-wrap:wrap}
.checkout-grid{display:grid;grid-template-columns:1fr .8fr;gap:28px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field input,.field select{padding:13px;border-radius:9px;border:1px solid #444;background:#050505;color:#fff}.payment{display:grid;gap:10px;margin:18px 0}.payment label{padding:14px;border:1px solid #ffffff18;border-radius:10px;background:#080808}.note{color:#888;font-size:13px;line-height:1.5}.error{color:#ff8b8b;min-height:20px}.success{display:none;text-align:center;margin:30px 0}.success.open{display:block}.success-mark{font-size:65px;color:#7dff9b}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.info-card{background:#0b0b0b;border:1px solid #ffffff18;border-radius:20px;padding:25px}.info-card p,.info-card li{color:#aaa;line-height:1.65}.info-card h2{font-size:21px;margin:0 0 13px}.accent{color:var(--cyan)!important;font-weight:800}.gold-text{color:var(--gold)!important;font-weight:800}
.legal-page{padding:70px 0 100px;min-height:calc(100vh - 68px)}.legal-box{border:1px solid #ffffff18;border-radius:18px;background:#0b0b0b;padding:30px;max-width:850px}.legal-page p,.legal-page li{color:#bbb;font-size:17px;line-height:1.7}.legal-page h1{margin-top:10px}
@media(max-width:760px){.wrap{width:min(100% - 28px,560px)}.nav{height:62px}.navlinks a:not(.cart-link){display:none}.hero{min-height:auto;padding:70px 0}.hero-grid,.grid2,.steps,.shop-layout,.checkout-grid,.info-grid{grid-template-columns:1fr}.hero-grid{gap:30px}h1{font-size:58px}.hero p,.lead{font-size:17px}.product{height:410px}.pouch{width:205px;height:305px}.insiderbox{flex-direction:column;align-items:stretch}.insider form{flex-direction:column}.insider input{width:100%}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.cart-line{grid-template-columns:1fr}.cart-actions{justify-content:flex-start}.footrow{flex-direction:column}}
</style></head>
<body><header><div class="wrap nav"><a class="logo" href="index.html">JALDOR<b>X</b></a><nav class="navlinks"><a href="shop.html">SHOP</a><a href="info.html">INFO</a><a href="index.html#insider">INSIDER</a><a class="cart-link" href="warenkorb.html">🛒 <span class="cart-count">0</span></a></nav></div></header>
<main><div class="wrap page"><div class="page-head"><div class="kicker">DEIN WARENKORB</div><h1>WARENKORB.</h1></div><div id="cart"></div></div></main>
<footer class="footer"><div class="wrap footrow"><strong>JALDOR<b style="color:#e5232e">X</b></strong><div class="footlinks"><a href="info.html">Info</a><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a><a href="kontakt.html">Kontakt</a></div><span>© 2026 JALDORX</span></div></footer><script>
const MAX=40,BASE=3.99,tiers=[{max:4,price:3.99},{max:9,price:3.79},{max:19,price:3.69},{max:29,price:3.59},{max:39,price:3.35}];
const euro=n=>Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const get=()=>{try{return JSON.parse(localStorage.getItem('jaldorxCart')||'{}')||{}}catch(e){return {}}};
const save=c=>{localStorage.setItem('jaldorxCart',JSON.stringify(c));localStorage.setItem('jaldorxCartQty',String(c.mystery?.qty||0))};
const unit=q=>q===40?129.90/40:(tiers.find(t=>q<=t.max)||tiers[0]).price;
const total=q=>q===40?129.90:q*unit(q);
function render(){const c=get(),q=Math.min(MAX,Number(c.mystery?.qty||0)),el=document.getElementById('cart');document.querySelectorAll('.cart-count').forEach(x=>x.textContent=q);
if(!q){el.innerHTML='<div class="cart-box"><h2>Dein Warenkorb ist leer.</h2><p class="muted">Füge zuerst einen Mystery Duftbaum hinzu.</p><a class="btn primary" href="shop.html">ZUM SHOP</a></div>';return}
const sub=total(q),normal=q*BASE,saveAmt=normal-sub,free=sub>=99;
el.innerHTML=`<div class="cart-box"><div class="cart-line"><div><strong>Mystery Duftbaum</strong><div class="muted">${euro(unit(q))} pro Stück</div></div><div class="cart-actions"><button class="small-btn" id="minus">−</button><input class="qty-input" id="q" value="${q}" inputmode="numeric" style="width:70px;height:40px;text-align:center;background:#050505;color:#fff;border:1px solid #444;border-radius:8px"><button class="small-btn" id="plus">+</button></div><div><strong>${euro(sub)}</strong><br><button class="small-btn remove" id="remove">ENTFERNEN</button></div></div><div class="cart-total"><span>Gesamt</span><span>${euro(sub)}</span></div><p class="muted">${saveAmt>0?`Mengenrabatt: − ${euro(saveAmt)} · `:''}${free?'Versand kostenlos ab 99 €':'Versandkosten werden im Checkout angezeigt.'}</p><div class="cart-buttons"><button class="small-btn" id="clear">WARENKORB LEEREN</button><a class="btn secondary" href="shop.html">WEITER SHOPPEN</a><a class="btn primary" href="checkout.html">ZUR KASSE</a></div></div>`;
document.getElementById('minus').onclick=()=>setQty(q-1);document.getElementById('plus').onclick=()=>setQty(q+1);
document.getElementById('q').oninput=e=>{let n=parseInt(e.target.value.replace(/[^0-9]/g,''),10)||0;setQty(n,true)};
document.getElementById('remove').onclick=()=>{save({});render()};document.getElementById('clear').onclick=()=>{save({});render()};
}
function setQty(n,silent=false){n=Math.max(1,Math.min(MAX,n));if(n>=MAX&&!silent){}save({mystery:{qty:n}});render()}
document.addEventListener('DOMContentLoaded',render);
</script></body></html>
