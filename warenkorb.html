<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JALDORX — Warenkorb</title>
<style>
:root{--bg:#050505;--fg:#fff;--muted:#aaa;--gold:#d7b43a;--cyan:#00d9ff;--red:#e5232e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}header{position:fixed;top:0;left:0;right:0;z-index:10;background:#050505e8;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff14}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900}.logo b{color:var(--red)}.navlinks{display:flex;gap:20px;align-items:center;font-size:14px;font-weight:800}.cart-nav{border:0;background:transparent;color:#fff;font:inherit;padding:8px}main{padding:125px 0 90px;min-height:80vh}.kicker{color:var(--cyan);font-size:13px;font-weight:900;letter-spacing:.2em}h1{font-size:clamp(48px,7vw,82px);line-height:.92;letter-spacing:-.045em;margin:12px 0 38px}.card{border:1px solid #ffffff18;border-radius:22px;background:#0b0b0b;padding:28px}.item{display:flex;gap:18px;align-items:center;border-bottom:1px solid #ffffff12;padding-bottom:24px}.thumb{width:75px;height:95px;border-radius:8px;background:#090909;border:1px solid #333;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:900}.info{flex:1}.info strong{font-size:19px}.muted{display:block;color:#999;margin-top:5px}.qty{display:flex;align-items:center;border:1px solid #ffffff2b;border-radius:999px;background:#0d0d10;overflow:hidden;margin-top:12px;width:max-content}.qty button{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:22px;cursor:pointer}.qty input{width:58px;height:44px;text-align:center;background:transparent;border:0;color:#fff;font-size:17px;font-weight:900;outline:none}.remove{border:1px solid #555;background:transparent;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:800;margin-top:10px}.warning{color:#ff6b6b;font-weight:800;min-height:20px;margin-top:10px}.summary{max-width:520px;margin:28px 0 0 auto}.row{display:flex;justify-content:space-between;margin:9px 0;color:#bbb}.discount{color:#f5c84c}.total{font-size:23px;font-weight:900;color:#fff;border-top:1px solid #ffffff18;padding-top:16px;margin-top:16px}.progress{margin:18px 0;padding:13px 15px;border-radius:14px;background:#00d9ff0d;color:#cdeff4}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:10px;padding:14px 18px;font-weight:900;cursor:pointer}.primary{background:#fff;color:#000}.secondary{background:transparent;color:#fff;border:1px solid #555}.empty{padding:40px 0;color:#aaa}.footer{border-top:1px solid #ffffff12;padding:42px 0;color:#888;font-size:13px}.footrow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footlinks{display:flex;gap:18px}@media(max-width:760px){.wrap{width:min(100% - 28px,560px)}.navlinks a:not(.cart-nav){display:none}.item{align-items:flex-start}.summary{margin-left:0}.actions>*{width:100%;text-align:center}.footer .footrow{flex-direction:column}.footlinks{flex-wrap:wrap}}
</style></head><body>
<header><div class="wrap nav"><a class="logo" href="index.html">JALDOR<b>X</b></a><nav class="navlinks"><a href="index.html">HOME</a><a href="shop.html">SHOP</a><a href="index.html#insider">INSIDER WERDEN</a><button class="cart-nav" type="button">🛒 <span id="cart-count">0</span></button></nav></div></header>
<main><div class="wrap"><div class="kicker">WARENKORB</div><h1>DEIN WARENKORB</h1><div id="cart-page"></div></div></main>
<footer class="footer"><div class="wrap footrow"><strong>JALDOR<b style="color:#e5232e">X</b></strong><div class="footlinks"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a><a href="kontakt.html">Kontakt</a></div><span>© 2026 JALDORX</span></div></footer>
<script>
const MAX=40,BASE=3.99,tiers=[{max:4,price:3.99},{max:9,price:3.79},{max:19,price:3.69},{max:29,price:3.59},{max:39,price:3.35}];
const euro=n=>Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'}),unit=n=>n===40?129.9/40:(tiers.find(t=>n<=t.max)||tiers[0]).price,total=n=>n===40?129.9:n*unit(n);
const getCart=()=>{try{return JSON.parse(localStorage.getItem('jaldorxCart')||'{}')||{}}catch(e){return {}}},saveCart=c=>{localStorage.setItem('jaldorxCart',JSON.stringify(c));localStorage.setItem('jaldorxCartQty',String(c.mystery?.qty||0))},count=c=>Number(c.mystery?.qty||0);
function render(){const c=getCart(),q=count(c),root=document.getElementById('cart-page');document.getElementById('cart-count').textContent=q;if(!q){root.innerHTML='<div class="empty"><h2>Dein Warenkorb ist leer.</h2><p>Entdecke den Mystery Duftbaum und stelle deine Bestellung zusammen.</p><a class="btn primary" href="shop.html">ZUM SHOP</a></div>';return}const normal=q*BASE,sub=total(q),save=normal-sub,free=sub>=99;root.innerHTML=`<div class="card"><div class="item"><div class="thumb">MYSTERY<br>DUFTBAUM</div><div class="info"><strong>Mystery Duftbaum</strong><span class="muted">3,99 € Einzelpreis</span><div class="qty"><button id="minus" type="button">−</button><input id="qty" value="${q}" inputmode="numeric" pattern="[0-9]*" aria-label="Menge"><button id="plus" type="button">+</button></div><div id="warning" class="warning"></div></div><div style="text-align:right"><strong>${euro(sub)}</strong><br><button id="remove" class="remove" type="button">ENTFERNEN</button></div></div><div class="summary"><div class="row"><span>Normalpreis</span><span>${euro(normal)}</span></div><div class="row discount"><span>Mengenrabatt</span><span>− ${euro(save)}</span></div><div class="row"><span>Versand</span><span>${free?'Kostenlos':'wird im Checkout berechnet'}</span></div><div class="row total"><span>Gesamt</span><span>${euro(sub)}</span></div><div class="progress">${free?'🎉 Kostenloser Versand erreicht!':`Noch ${euro(99-sub)} bis zum kostenlosen Versand.`}</div><div class="actions"><button id="clear" class="btn secondary" type="button">WARENKORB LEEREN</button><a class="btn secondary" href="shop.html">WEITER SHOPPEN</a><button id="checkout" class="btn primary" type="button">ZUR KASSE</button></div></div></div>`;
const warn=m=>{const w=document.getElementById('warning');w.textContent=m;setTimeout(()=>{if(w.textContent===m)w.textContent=''},2500)};
const setQty=v=>{let n=parseInt(String(v).replace(/\D/g,''),10);if(!Number.isFinite(n)||n<1)n=1;if(n>MAX){n=MAX;warn('Maximal 40 Stück pro Online-Bestellung.')}c.mystery.qty=n;saveCart(c);render()};
document.getElementById('minus').onclick=()=>setQty(q-1);document.getElementById('plus').onclick=()=>{if(q>=MAX){warn('Maximal 40 Stück pro Online-Bestellung.');return}setQty(q+1)};document.getElementById('qty').onchange=e=>setQty(e.target.value);document.getElementById('qty').onblur=e=>setQty(e.target.value||1);document.getElementById('qty').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}};document.getElementById('remove').onclick=()=>{delete c.mystery;saveCart(c);render()};document.getElementById('clear').onclick=()=>{saveCart({});render()};document.getElementById('checkout').onclick=()=>alert('Checkout wird als nächster Schritt ergänzt')}
document.addEventListener('DOMContentLoaded',render);
</script></body></html>
